<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmer Films - Urgence</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #1a1a2e;
            color: white;
        }
        .container {
            background-color: #16213e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            color: #ff6b35;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #ffa500;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #0f3460;
            border-radius: 5px;
            background-color: #0f3460;
            color: white;
            font-size: 16px;
        }
        button {
            background-color: #ff6b35;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #ff8c61;
        }
        button:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background-color: #28a745;
            border: 2px solid #1e7e34;
        }
        .error {
            background-color: #dc3545;
            border: 2px solid #bd2130;
        }
        #moviesList {
            max-height: 300px;
            overflow-y: auto;
            background-color: #0f3460;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
        .movie-item {
            padding: 8px;
            margin: 5px 0;
            background-color: #16213e;
            border-radius: 3px;
            cursor: pointer;
        }
        .movie-item:hover {
            background-color: #1e2a4a;
        }
        .instructions {
            background-color: #ffa500;
            color: #1a1a2e;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 PROGRAMMER VOS FILMS - MODE URGENCE</h1>
        
        <div class="instructions">
            ⚠️ IMPORTANT : Après avoir programmé vos films ici, vous DEVEZ redéployer votre site pour que les clients les voient !
        </div>

        <div class="form-group">
            <button onclick="chargerFilms()" id="loadBtn">1️⃣ CHARGER LA LISTE DES FILMS</button>
            <div id="moviesList"></div>
        </div>

        <div class="form-group">
            <label>2️⃣ Film sélectionné :</label>
            <input type="text" id="movieId" placeholder="Cliquez sur un film ci-dessus" readonly>
            <input type="text" id="movieTitle" placeholder="Titre du film" readonly style="margin-top: 5px;">
        </div>

        <div class="form-group">
            <label>3️⃣ Date (format: 2024-10-29) :</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label>4️⃣ Créneau horaire :</label>
            <select id="timeSlot" required>
                <option value="21h15">1er Film - 19h00 (Entrée 18h45)</option>
                <option value="23h45">2ème Film - 21h15 (Entrée 21h00)</option>
                <option value="01h30">3ème Film - 23h30 (Entrée 23h15)</option>
            </select>
        </div>

        <div class="form-group">
            <label>5️⃣ Capacité (nombre de voitures) :</label>
            <input type="number" id="capacity" value="21" min="1" max="50" required>
        </div>

        <button onclick="programmerFilm()" id="submitBtn">🎃 PROGRAMMER LE FILM</button>

        <div id="result"></div>
    </div>

    <script>
        const API_URL = 'https://drivinnchill.fr/api';
        const TOKEN = 'admin_token_2024';

        async function chargerFilms() {
            const btn = document.getElementById('loadBtn');
            const moviesList = document.getElementById('moviesList');
            
            btn.disabled = true;
            btn.textContent = '⏳ Chargement...';
            moviesList.innerHTML = '';
            
            try {
                const response = await fetch(`${API_URL}/movies`, {
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) throw new Error('Erreur de chargement');
                
                const films = await response.json();
                const activeFilms = films.filter(f => f.is_active);
                
                if (activeFilms.length === 0) {
                    moviesList.innerHTML = '<p style="color: yellow;">Aucun film actif trouvé</p>';
                    return;
                }
                
                moviesList.innerHTML = `<strong>${activeFilms.length} films disponibles :</strong><br><br>`;
                
                activeFilms.forEach(film => {
                    const div = document.createElement('div');
                    div.className = 'movie-item';
                    div.innerHTML = `<strong>${film.title}</strong><br><small>${film.duration_minutes} min • ${film.genre}</small>`;
                    div.onclick = () => {
                        document.getElementById('movieId').value = film.id;
                        document.getElementById('movieTitle').value = film.title;
                        // Highlight selected
                        document.querySelectorAll('.movie-item').forEach(i => i.style.border = 'none');
                        div.style.border = '2px solid #ffa500';
                    };
                    moviesList.appendChild(div);
                });
                
                btn.textContent = '✅ Films chargés !';
                setTimeout(() => {
                    btn.textContent = '🔄 RECHARGER LA LISTE';
                    btn.disabled = false;
                }, 2000);
                
            } catch (error) {
                console.error(error);
                moviesList.innerHTML = `<p style="color: red;">❌ Erreur : ${error.message}</p>`;
                btn.disabled = false;
                btn.textContent = '🔄 RÉESSAYER';
            }
        }

        async function programmerFilm() {
            const movieId = document.getElementById('movieId').value;
            const movieTitle = document.getElementById('movieTitle').value;
            const date = document.getElementById('date').value;
            const timeSlot = document.getElementById('timeSlot').value;
            const capacity = parseInt(document.getElementById('capacity').value);
            const resultDiv = document.getElementById('result');
            const submitBtn = document.getElementById('submitBtn');
            
            // Validation
            if (!movieId) {
                alert('⚠️ Veuillez sélectionner un film');
                return;
            }
            
            if (!date) {
                alert('⚠️ Veuillez choisir une date');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Programmation en cours...';
            resultDiv.style.display = 'none';
            
            try {
                const response = await fetch(`${API_URL}/movie-schedules`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        movie_id: movieId,
                        date: date,
                        time_slot: timeSlot,
                        capacity: capacity
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || 'Erreur de programmation');
                }
                
                // Success
                resultDiv.className = 'success';
                resultDiv.innerHTML = `
                    <strong>✅ FILM PROGRAMMÉ AVEC SUCCÈS !</strong><br><br>
                    🎬 <strong>${movieTitle}</strong><br>
                    📅 Date : ${date}<br>
                    🕐 Créneau : ${timeSlot}<br>
                    🚗 Capacité : ${capacity} voitures<br><br>
                    <strong style="color: yellow;">⚠️ N'OUBLIEZ PAS DE REDÉPLOYER VOTRE SITE !</strong>
                `;
                resultDiv.style.display = 'block';
                
                // Reset form
                document.getElementById('movieId').value = '';
                document.getElementById('movieTitle').value = '';
                document.querySelectorAll('.movie-item').forEach(i => i.style.border = 'none');
                
            } catch (error) {
                console.error(error);
                resultDiv.className = 'error';
                resultDiv.innerHTML = `
                    <strong>❌ ERREUR</strong><br><br>
                    ${error.message}<br><br>
                    Vérifiez que :<br>
                    • Le créneau n'est pas déjà pris<br>
                    • La date est valide<br>
                    • Vous êtes bien connecté
                `;
                resultDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🎃 PROGRAMMER LE FILM';
            }
        }
    </script>
</body>
</html>
